ill="#5e5277" text-anchor="start" >MCP · tool API · coding sessions</text><path d="M244 319H314" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><rect x="34" y="364" width="210" height="50" fill="#22163a"/><rect x="30" y="360" width="210" height="50" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="44" y="382" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Other companions</text><text x="44" y="400" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >yours, and paired hubs</text><path d="M244 385H314" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><rect x="324" y="84" width="340" height="350" fill="#22163a"/><rect x="320" y="80" width="340" height="350" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="340" y="110" font-size="16" font-weight="800" fill="#d6006b" text-anchor="start" font-family="'Courier New',ui-monospace,monospace">THE HUB · YOUR PC</text><text x="340" y="146" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >A key for every companion</text><text x="340" y="164" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >sealed with your passphrase</text><text x="340" y="198" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Brains</text><text x="340" y="216" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >which AI writes each reply</text><text x="340" y="250" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Notes, day pages, reminders</text><text x="340" y="268" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >your conversations stay here</text><text x="340" y="302" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >The one door</text><text x="340" y="320" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >every action is checked here</text><text x="340" y="354" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Approvals</text><text x="340" y="372" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >what waits for your OK</text><text x="340" y="416" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >Listens on 127.0.0.1: only this PC can reach it</text><rect x="324" y="464" width="340" height="56" fill="#0b8a99"/><rect x="320" y="460" width="340" height="56" fill="#eefafc" stroke="#0b8a99" stroke-width="2.5" /><text x="340" y="484" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Hologram Companion</text><text x="340" y="502" font-size="12" font-weight="400" fill="#5e5277" text-anchor="start" >on your Wi-Fi: speaks, rings alarms, changes lights</text><path d="M490 434V456" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)" marker-start="url(#a)"/><rect x="724" y="84" width="300" height="214" fill="#ff2d8a"/><rect x="720" y="80" width="300" height="214" fill="#fff0f7" stroke="#ff2d8a" stroke-width="2.5" /><text x="740" y="110" font-size="15" font-weight="800" fill="#d6006b" text-anchor="start" font-family="'Courier New',ui-monospace,monospace">WAIFU AI NETWORK</text><text x="740" y="142" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Registry</text><text x="1000" y="142" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >public names</text><text x="740" y="180" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Memory directory</text><text x="1000" y="180" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >which bank is yours</text><text x="740" y="218" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Memory bank</text><text x="1000" y="218" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >shared memory</text><text x="740" y="256" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Usage reports</text><text x="1000" y="256" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >anonymous counts</text><rect x="724" y="324" width="300" height="196" fill="#22163a"/><rect x="720" y="320" width="300" height="196" fill="#fff" stroke="#22163a" stroke-width="2.5" stroke-dasharray="8 6"/><text x="740" y="350" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" font-family="'Courier New',ui-monospace,monospace">SERVICES YOU CHOOSE</text><text x="740" y="386" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Brains</text><text x="1000" y="386" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >on-chain · local · Claude · GPT</text><text x="740" y="426" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Chat apps</text><text x="1000" y="426" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" >Discord · Telegram</text><text x="740" y="466" font-size="15" font-weight="800" fill="#22163a" text-anchor="start" >Web3</text><text x="1000" y="466" font-size="12" font-weight="400" fill="#5e5277" text-anchor="end" ></text><path d="M664 180H716" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><path d="M664 400H716" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><text x="30" y="560" font-size="13" font-weight="400" fill="#5e5277" text-anchor="start" >Pink: the four always-on services Waifu AI runs for everyone. Dashed: services you pick and switch on.</text></g></svg>