<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 370" width="1080" height="370" role="img" aria-label="One door for every action: a message arrives one of eight ways, the hub checks who is asking and what kind of action it is, then it runs, asks first, waits for your OK, or is blocked or refused">
<title>One door for every action: a message arrives one of eight ways, the hub checks who is asking and what kind of action it is, then it runs, asks first, waits for your OK, or is blocked or refused</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#22163a"/></marker>
<linearGradient id="rb" x1="0" x2="1"><stop offset="0" stop-color="#ff2d8a"/><stop offset=".25" stop-color="#ff8a1f"/><stop offset=".5" stop-color="#ffd84a"/><stop offset=".75" stop-color="#7fd88a"/><stop offset="1" stop-color="#36c9da"/></linearGradient></defs>
<rect x="6" y="6" width="1068" height="358" fill="#22163a"/><rect x="0" y="0" width="1068" height="358" fill="#fffcf3" stroke="#22163a" stroke-width="3"/>
<rect x="1.5" y="1.5" width="1065" height="6" fill="url(#rb)"/>
<g font-family="'Segoe UI',system-ui,-apple-system,Helvetica,Arial,sans-serif" fill="#22163a"><text x="30" y="46" font-size="18" font-weight="800" fill="#d6006b" text-anchor="start" font-family="'Courier New',ui-monospace,monospace">ONE DOOR FOR EVERY ACTION</text><rect x="34" y="80" width="236" height="230" fill="#22163a"/><rect x="30" y="76" width="236" height="230" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="46" y="104" font-size="15" font-weight="800" fill="#d6006b" text-anchor="start" >1 · It arrives</text><text x="46" y="136" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• App Chat</text><text x="46" y="163" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Voice, or at the device</text><text x="46" y="190" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Sneed SMS or Telegram</text><text x="46" y="217" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Discord DM or channel</text><text x="46" y="244" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• An AI app (MCP, tool API)</text><text x="46" y="271" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Another companion</text><path d="M270 191H292" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><rect x="302" y="80" width="236" height="230" fill="#22163a"/><rect x="298" y="76" width="236" height="230" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="314" y="104" font-size="15" font-weight="800" fill="#d6006b" text-anchor="start" >2 · Who is asking?</text><text x="314" y="136" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• You: in the app, or your phone</text><text x="314" y="163" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Your orchestrator, in your job</text><text x="314" y="190" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• A connected app, with its key</text><text x="314" y="217" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• A peer, a friend or a stranger</text><path d="M538 191H560" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><rect x="570" y="80" width="236" height="230" fill="#22163a"/><rect x="566" y="76" width="236" height="230" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="582" y="104" font-size="15" font-weight="800" fill="#d6006b" text-anchor="start" >3 · The checks</text><text x="582" y="136" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Read, setting, write or money?</text><text x="582" y="163" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Your autonomy settings and caps</text><text x="582" y="190" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Did it read others’ words?</text><text x="582" y="217" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Is &quot;stop all writes&quot; on?</text><text x="582" y="244" font-size="13" font-weight="400" fill="#22163a" text-anchor="start" >• Unsafe mode (your Discord DM)</text><path d="M806 191H828" fill="none" stroke="#22163a" stroke-width="2.5" marker-end="url(#a)"/><rect x="838" y="80" width="200" height="230" fill="#22163a"/><rect x="834" y="76" width="200" height="230" fill="#fff" stroke="#22163a" stroke-width="2.5" /><text x="850" y="104" font-size="15" font-weight="800" fill="#d6006b" text-anchor="start" >4 · The answer</text><rect x="850" y="122" width="168" height="26" fill="#c9f2d2" stroke="#22163a" stroke-width="2"/><text x="860" y="140" font-size="13" font-weight="800" fill="#0f5a26" text-anchor="start" >Runs</text><rect x="850" y="156" width="168" height="26" fill="#fff0b8" stroke="#22163a" stroke-width="2"/><text x="860" y="174" font-size="13" font-weight="800" fill="#6e5200" text-anchor="start" >Asks first</text><rect x="850" y="190" width="168" height="26" fill="#ffd2b0" stroke="#22163a" stroke-width="2"/><text x="860" y="208" font-size="13" font-weight="800" fill="#7a3300" text-anchor="start" >Waits for your OK</text><rect x="850" y="224" width="168" height="26" fill="#e9e2f1" stroke="#22163a" stroke-width="2"/><text x="860" y="242" font-size="13" font-weight="800" fill="#4a3f61" text-anchor="start" >Blocked</text><rect x="850" y="258" width="168" height="26" fill="#ffc9d6" stroke="#22163a" stroke-width="2"/><text x="860" y="276" font-size="13" font-weight="800" fill="#8a0030" text-anchor="start" >Refused</text><text x="30" y="340" font-size="13" font-weight="400" fill="#5e5277" text-anchor="start" >Every write is logged: ☰ → Activity shows who asked, what ran and how it ended.</text></g></svg>